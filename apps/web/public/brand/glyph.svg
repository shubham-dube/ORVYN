<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ORVYN mark: a world of your own, with everything in orbit around it -->
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#1d2f7a"/>
      <stop offset="0.5" stop-color="#0b1236"/>
      <stop offset="1" stop-color="#04060e"/>
    </radialGradient>
    <radialGradient id="orb" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="0.22" stop-color="#8fd3ff"/>
      <stop offset="0.55" stop-color="#3b6cf6"/>
      <stop offset="0.85" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2e1065"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="front"><rect x="-200" y="256" width="912" height="400"/></clipPath>
    <clipPath id="back"><rect x="-200" y="-200" width="912" height="456"/></clipPath>
  </defs>
  
  <circle cx="256" cy="256" r="128" fill="#3b82f6" opacity="0.5" filter="url(#glow)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="198" ry="66" fill="none" stroke="url(#ring)" stroke-width="11" clip-path="url(#back)" opacity="0.6"/>
  </g>
  <circle cx="256" cy="256" r="104" fill="url(#orb)"/>
  <ellipse cx="226" cy="214" rx="38" ry="24" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="198" ry="66" fill="none" stroke="#0b1236" stroke-width="27" clip-path="url(#front)" opacity="0.55"/>
    <ellipse cx="256" cy="256" rx="198" ry="66" fill="none" stroke="url(#ring)" stroke-width="11" clip-path="url(#front)"/>
    <circle cx="434" cy="286" r="20" fill="#22d3ee" opacity="0.6" filter="url(#soft)"/>
    <circle cx="434" cy="286" r="14" fill="#ecfeff"/>
  </g>
</svg>
