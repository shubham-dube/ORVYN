name: orvyn
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  drift: ^2.35.4
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  home_widget: ^0.10.0
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  rrule: ^0.2.18
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
