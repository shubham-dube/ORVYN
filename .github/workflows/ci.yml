name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orvyn
          POSTGRES_PASSWORD: orvyn
          POSTGRES_DB: orvyn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orvyn" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://orvyn:orvyn@localhost:5432/orvyn_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Web e2e (real API + production build)
        run: |
          pnpm --filter @orvyn/web exec playwright install --with-deps chromium
          pnpm --filter @orvyn/web e2e
        env:
          E2E_DATABASE_URL: postgres://orvyn:orvyn@localhost:5432/orvyn_test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/test-results, retention-days: 7 }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
