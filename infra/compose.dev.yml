# Local databases for development: `docker compose -f infra/compose.dev.yml up -d`
name: orvyn-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orvyn
      POSTGRES_PASSWORD: orvyn
      POSTGRES_DB: orvyn_dev
    ports: ['5432:5432']
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'orvyn']
      interval: 5s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']
    volumes: [valkey:/data]
volumes:
  pg:
  valkey:
